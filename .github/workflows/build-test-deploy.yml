name: build-test-deploy

on: push

jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - name: checkout repo
     uses: actions/checkout@v4
   - name: use node.js
     uses: actions/setup-node@v4
     with:
      node-version: '20.x'
   - run: npm install
   - run: npm run build

 test:
  needs: build
  runs-on: ubuntu-latest
  steps:
   - name: checkout repo
     uses: actions/checkout@v4
   - name: use node.js
     uses: actions/setup-node@v4
     with:
      node-version: '20.x'
   - run: npm install
   - run: npm test

 deploy:
  needs: test
  # A job that `uses:` a reusable workflow cannot also have runs-on/steps/environment.
  # This LOCAL reference (./...) is what creates the job_workflow_ref we want to see.
  uses: ./.github/workflows/claims-probe.yml
  permissions:
   id-token: write
   contents: read
