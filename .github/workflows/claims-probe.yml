name: claims-probe

on: workflow_call

jobs:
 probe:
  runs-on: ubuntu-latest
  steps:
   - name: decode oidc claims (no raw token printed)
     run: |
      set -euo pipefail
      TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
        "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value')
      P=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
      case $((${#P} % 4)) in 2) P="$P==";; 3) P="$P=";; esac
      echo "$P" | base64 -d | jq '{workflow, workflow_ref, job_workflow_ref, ref, repository, repository_owner, event_name}'
